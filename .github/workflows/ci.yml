# Integração contínua do Invest System (história 3).
#
# O que faz: a cada push e a cada pull request, instala Python 3.11,
# as dependências do requirements.txt (e do requirements-dev.txt, se existir)
# e roda `python -m pytest -q`.
#
# Sem segredos: este workflow não usa nenhum Secret do GitHub.
#
# Sobre "nenhum teste ainda": o pytest sai com código 5 quando não encontra
# testes. Tratamos esse código como aceitável para o workflow não ficar
# vermelho antes da existência da suíte. Assim que houver testes, qualquer
# falha real (código 1 ou outro) reprova o build. Quando a suíte existir,
# pode-se remover o `|| [ $? -eq 5 ]` para exigir testes.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Instalar e testar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi

      - name: Rodar os testes
        # Código 5 do pytest = nenhum teste coletado (ainda não há suíte).
        run: python -m pytest -q || [ $? -eq 5 ]
